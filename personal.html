<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Generator | Project Nebo</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="tool-page">

<div class="subnav">
    <a href="index.html" class="back-link">&larr; Project Nebo</a>
</div>

<header class="site-header">
    <div>
        <h1>Personal Generator</h1>
        <p>Identity, contact information, usernames, and passwords.</p>
    </div>
    <button id="themeToggle">
        🌙
    </button>
</header>

<main class="container">
    <section class="generator-panel">

        <div class="field-group">
            <label for="firstName">First Name</label>
            <div class="field-value-wrap">
                <span id="firstName" class="field-value">—</span>
                <button class="copy-btn" data-target="firstName" title="Copy">📋</button>
            </div>
        </div>

        <div class="field-group">
            <label for="lastName">Last Name</label>
            <div class="field-value-wrap">
                <span id="lastName" class="field-value">—</span>
                <button class="copy-btn" data-target="lastName" title="Copy">📋</button>
            </div>
        </div>

        <!-- Full Name and SSN aren't related data — just two short values
             paired to save a row, same space-saving idea as the others.
             "stacked" here is only to get the full-row grid span (like
             the other paired rows) — without it, this row was confined
             to a single ~400px grid cell instead of the full panel
             width, which was forcing longer full names to wrap. -->
        <div class="field-group stacked">
            <div class="field-row">
                <div class="field-item">
                    <label for="fullName">Full Name</label>
                    <div class="field-value-wrap">
                        <span id="fullName" class="field-value">—</span>
                        <button class="copy-btn" data-target="fullName" title="Copy">📋</button>
                    </div>
                </div>
                <div class="field-item">
                    <label for="ssn">SSN</label>
                    <div class="field-value-wrap">
                        <span id="ssn" class="field-value">—</span>
                        <button class="copy-btn" data-target="ssn" title="Copy">📋</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Age Range control leads, DOB/Age follow — reads like the
             control that produces them, same order as State leading
             into City/Zip below. -->
        <div class="field-group stacked">
            <div class="field-row">
                <div class="field-item">
                    <span class="control-label">Age Range</span>
                    <div class="age-range-inputs">
                        <input type="number" id="minAge" value="18" min="0" max="117">
                        <span>to</span>
                        <input type="number" id="maxAge" value="65" min="0" max="117">
                    </div>
                </div>
                <div class="field-item">
                    <label for="dob">Date of Birth</label>
                    <div class="field-value-wrap">
                        <span id="dob" class="field-value">—</span>
                        <button class="copy-btn" data-target="dob" title="Copy">📋</button>
                    </div>
                </div>
                <div class="field-item">
                    <label for="age">Age</label>
                    <div class="field-value-wrap">
                        <span id="age" class="field-value">—</span>
                        <button class="copy-btn" data-target="age" title="Copy">📋</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="field-group">
            <label for="phone">Phone</label>
            <div class="field-value-wrap">
                <span id="phone" class="field-value">—</span>
                <button class="copy-btn" data-target="phone" title="Copy">📋</button>
            </div>
        </div>

        <div class="field-group">
            <label for="street">Street</label>
            <div class="field-value-wrap">
                <span id="street" class="field-value">—</span>
                <button class="copy-btn" data-target="street" title="Copy">📋</button>
            </div>
        </div>

        <!-- City/state/zip are one location — grouped into one row (wraps
             to fewer per line on narrow screens rather than staying scattered). -->
        <div class="field-group stacked">
            <div class="field-row">
                <div class="field-item">
                    <label for="city">City</label>
                    <div class="field-value-wrap">
                        <span id="city" class="field-value">—</span>
                        <button class="copy-btn" data-target="city" title="Copy">📋</button>
                    </div>
                </div>
                <div class="field-item">
                    <label for="state">State</label>
                    <div class="field-value-wrap">
                        <span id="state" class="field-value">—</span>
                        <button class="copy-btn" data-target="state" title="Copy">📋</button>
                    </div>
                </div>
                <div class="field-item">
                    <label for="zip">Zip</label>
                    <div class="field-value-wrap">
                        <span id="zip" class="field-value">—</span>
                        <button class="copy-btn" data-target="zip" title="Copy">📋</button>
                    </div>
                </div>
            </div>
            <div class="field-control-row">
                <span class="control-label">Select state (also sets city/zip/phone)</span>
                <select id="stateSelect">
                    <option value="">Random</option>
                </select>
            </div>
        </div>

        <!-- "stacked" here only gets the full-row grid span (same fix
             as Full Name earlier) — Email was alone in a single ~400px
             grid cell with an empty one beside it, not the full width
             it looked like it had, which is why long addresses wrapped. -->
        <div class="field-group stacked">
            <div class="field-row">
                <label for="email">Email</label>
                <div class="field-value-wrap">
                    <span id="email" class="field-value">—</span>
                    <button class="copy-btn" data-target="email" title="Copy">📋</button>
                </div>
            </div>
        </div>

        <!-- Username and Password grouped into one row; the password
             options control stays compact below rather than spanning
             the full row width. -->
        <div class="field-group stacked">
            <div class="field-row">
                <div class="field-item">
                    <label for="username">Username</label>
                    <div class="field-value-wrap">
                        <span id="username" class="field-value">—</span>
                        <button class="copy-btn" data-target="username" title="Copy">📋</button>
                    </div>
                </div>
                <div class="field-item">
                    <label for="password">Password</label>
                    <div class="field-value-wrap">
                        <span id="password" class="field-value">—</span>
                        <button class="copy-btn" data-target="password" title="Copy">📋</button>
                    </div>
                </div>
            </div>
            <div class="field-control-row">
                <span class="control-label">Length &amp; symbols</span>
                <div class="password-options-inputs">
                    <input type="number" id="passwordLength" value="12" min="8" max="64" title="Password length">
                    <label class="symbol-toggle">
                        <input type="checkbox" id="includeSymbols" checked>
                        Symbols
                    </label>
                </div>
            </div>
        </div>

        <button id="regenerateBtn" class="primary-btn">Generate</button>

        <!-- Bulk export — styled like the password length control, but
             its own row since it applies to every field, not just one. -->
        <div class="export-row">
            <span class="control-label">Records to export</span>
            <div class="export-inputs">
                <input type="number" id="exportCount" value="1" min="1" max="500" title="Number of records to export">
                <button id="exportCsvBtn">Export CSV</button>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>
        Project Nebo v0.1.0-beta |
        Runs locally in your browser
    </p>
</footer>

<script src="js/theme.js"></script>
<script src="js/personal.js"></script>
<script src="js/clipboard.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        initializeTheme();
    });
</script>
</body>
</html>
